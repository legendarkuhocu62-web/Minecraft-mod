
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoBrowser — Смотрим вместе</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

  <!-- ЭКРАН 1: СОЗДАНИЕ ПРОФИЛЯ -->
  <div id="profile-screen" class="screen active">
    <div class="card">
      <h1>CoBrowser</h1>
      <p class="subtitle">Общий браузер для совместного просмотра</p>

      <div class="avatar-preview">
        <img id="avatar-img" src="https://api.dicebear.com/7.x/bottts/svg?seed=Guest" alt="Аватар">
        <div class="avatar-actions">
          <button type="button" id="random-avatar-btn" class="btn-secondary btn-small">Сменить аватар</button>
          <button type="button" id="custom-avatar-btn" class="btn-secondary btn-small">Своя картинка</button>
          <input type="file" id="custom-avatar-input" accept="image/*">
        </div>
      </div>

      <input type="text" id="username-input" placeholder="Придумай никнейм..." maxlength="20">
      <button id="save-profile-btn" class="btn-primary">Продолжить</button>
    </div>
  </div>

  <!-- МОДАЛКА ОБРЕЗКИ АВАТАРКИ В КРУЖОЧЕК -->
  <div id="crop-modal" class="modal hidden">
    <div class="card crop-card">
      <h3>Обрезка в кружочек</h3>
      <p class="subtitle">Подвигай картинку и настрой масштаб</p>

      <div id="crop-stage" class="crop-stage">
        <img id="crop-image" src="" alt="Предпросмотр">
        <div class="crop-circle-mask"></div>
      </div>

      <div class="crop-controls">
        <label>Масштаб: <span id="crop-zoom-val">100%</span></label>
        <input type="range" id="crop-zoom" min="100" max="300" value="100">

        <label>По горизонтали</label>
        <input type="range" id="crop-x" min="-100" max="100" value="0">

        <label>По вертикали</label>
        <input type="range" id="crop-y" min="-100" max="100" value="0">
      </div>

      <div class="crop-btns">
        <button type="button" id="cancel-crop-btn" class="btn-secondary">Отмена</button>
        <button type="button" id="apply-crop-btn" class="btn-primary">Поставить аву</button>
      </div>
    </div>
  </div>

  <!-- ЭКРАН 2: ЛОББИ -->
  <div id="lobby-screen" class="screen">
    <div class="card">
      <div class="user-badge">
        <img id="lobby-avatar" src="" alt="">
        <span id="lobby-username"></span>
        <button id="edit-profile-btn" class="btn-link">Изменить</button>
      </div>

      <h2>Комната просмотра</h2>
      <button id="create-room-btn" class="btn-primary">Создать комнату (Я Главный)</button>

      <div class="divider">или войти по коду</div>

      <div class="join-row">
        <input type="text" id="room-code-input" placeholder="Код комнаты...">
        <button id="join-room-btn" class="btn-secondary">Войти</button>
      </div>
    </div>
  </div>

  <!-- ЭКРАН 3: КОМНАТА -->
  <div id="room-screen" class="screen">
    <header class="topbar">
      <div class="room-info">
        <span class="badge-host" id="role-badge">👑 Вы Главный</span>
        <span>Комната: <strong id="current-room-id"></strong></span>
        <button id="copy-invite-btn" class="btn-small btn-secondary">Копировать ссылку</button>

        <div class="ru-mode-box">
          <span class="ru-label">🇷🇺 Для России</span>
          <button type="button" id="ru-toggle-btn" class="ru-switch" aria-pressed="false">Выкл</button>
        </div>
      </div>

      <div class="browser-connect">
        <input type="text" id="neko-url-input" placeholder="Поиск в Google или введите URL">
        <button id="connect-browser-btn" class="btn-primary btn-small">Найти в Google / Открыть</button>
        <button id="external-open-btn" class="btn-secondary btn-small" title="Открыть в новой вкладке">↗ Вкладка</button>
      </div>
    </header>

    <main class="workspace">
      <div id="browser-container" class="browser-container">
        <button type="button" id="expand-browser-btn" class="expand-btn" title="Во весь экран">⛶ На весь экран</button>

        <div id="google-launcher" class="google-launcher">
          <div class="google-logo">Google</div>
          <p id="google-hint" class="google-hint">Введите запрос для поиска в Google или адрес сайта</p>
          <div class="google-search-box">
            <input type="text" id="google-query-input" placeholder="Поиск в Google или введите URL">
            <button type="button" id="google-search-btn" class="btn-primary">Найти в Google</button>
          </div>
          <div id="search-results" class="search-results"></div>
        </div>

        <iframe id="virtual-browser-frame" class="hidden" allow="autoplay; fullscreen; clipboard-read; clipboard-write" allowfullscreen></iframe>
        <div id="viewer-shield" class="viewer-shield hidden" title="Управление сейчас у другого участника"></div>
      </div>

      <aside class="sidebar">
        <div class="panel-section">
          <h4>Участники (<span id="users-count">1</span>)</h4>
          <ul id="users-list" class="users-list"></ul>
        </div>

        <div class="panel-section chat-section">
          <h4>Чат комнаты</h4>
          <div id="chat-messages" class="chat-messages"></div>
          <form id="chat-form" class="chat-form">
            <input type="text" id="chat-input" placeholder="Сообщение..." autocomplete="off">
            <button type="submit">➤</button>
          </form>
        </div>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    (function () {
      const btn = document.getElementById('expand-browser-btn');
      const box = document.getElementById('browser-container');
      if (!btn || !box) return;
      btn.addEventListener('click', () => {
        const expanded = box.classList.toggle('expanded');
        btn.textContent = expanded ? '✕ Свернуть' : '⛶ На весь экран';
      });
    })();
  </script>
</body>
</html>
